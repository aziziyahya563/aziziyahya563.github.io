<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0a0f" id="themeColorMeta" />
    <meta
      name="description"
      content="Azizi Yahya's personal collection of apps, tools, and creative projects."
    />
    <title>Azizi Yahya's Apps</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- GitHub Pages SPA Redirect Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Instant theme initialization to avoid flash -->
    <script>
      (function () {
        const t = localStorage.getItem("REACT_APP_THEME") || "dark";
        document.documentElement.setAttribute("data-theme", t);
        const meta = document.getElementById("themeColorMeta");
        if (meta) meta.content = t === "dark" ? "#0a0a0f" : "#f0f2f8";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
